services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh
    command: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  mongo:
    image: mongo:7.0
    container_name: mongo
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        test $$(mongosh --quiet --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) } catch(e) {}; rs.status().ok') -eq 1
      interval: "10s"
      start_period: "30s"
      
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  activation-api:
    build:
      context: .
      dockerfile: apps/activation-api/Dockerfile
    container_name: activation-api
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: ${MONGO_URI_ACTIVATION:-mongodb://mongo:27017/activation_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    container_name: billing-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: ${MONGO_URI_BILLING:-mongodb://mongo:27017/billing_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  provisioning-service:
    build:
      context: .
      dockerfile: apps/provisioning-service/Dockerfile
    container_name: provisioning-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: ${MONGO_URI_PROVISIONING:-mongodb://mongo:27017/provisioning_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: ${MONGO_URI_NOTIFICATION:-mongodb://mongo:27017/notification_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  crm-analytics-service:
    build:
      context: .
      dockerfile: apps/crm-analytics-service/Dockerfile
    container_name: crm-analytics-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics
      MONGO_URI: ${MONGO_URI_CRM:-mongodb://mongo:27017/crm_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  demo-ui:
    build:
      context: .
      dockerfile: apps/demo-ui/Dockerfile
    container_name: demo-ui
    ports:
      - "5173:5173"
  loyalty-service:
    build:
      context: .
      dockerfile: apps/loyalty-service/Dockerfile
    container_name: loyalty-service
    profiles:
      - loyalty
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty-svc
      MONGO_URI: ${MONGO_URI_LOYALTY:-mongodb://mongo:27017/loyalty_db?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
